name: AppMethode Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force_alert:
        description: "Telegram Testnachricht senden"
        required: false
        type: boolean
        default: false

jobs:
  monitor:
    name: Check appmethode.com
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: AppMethode pruefen
        run: node scripts/monitor.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_ALERT: ${{ github.event_name == 'workflow_dispatch' && inputs.force_alert == true && 'true' || 'false' }}
